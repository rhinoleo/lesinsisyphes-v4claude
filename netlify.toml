# Configuration du déploiement sur Netlify.
# À chaque push sur la branche main, Netlify construit le site et publie le dossier dist/.
# Les redirections des anciennes adresses .php sont dans public/_redirects.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Les fichiers générés par Astro portent une empreinte dans leur nom :
# ils peuvent rester en cache un an sans risque d'être périmés.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
